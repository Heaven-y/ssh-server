# 每次推送和 PR 运行与本地相同的 npm run check
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # 项目在 Windows 上开发（路径、PowerShell 相关逻辑），同时在 Linux 上跑一遍
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 定位 Windows 系统加密阶段
        if: runner.os == 'Windows'
        run: node --import tsx scripts/dev/diagnose-windows-protection.ts
      - run: npm run check
