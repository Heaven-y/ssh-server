<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: #f5f6f8;
        color: #1b2230;
        color-scheme: light;
      }
      html[data-theme='dark'] {
        background: #101114;
        color: #eeeff3;
        color-scheme: dark;
      }
    </style>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem('ssh-server.ui.v1') || 'null');
        if (
          p?.version === 1 &&
          p.theme === 'dark' &&
          typeof p.sidebarCollapsed === 'boolean' &&
          Number.isFinite(p.sidebarWidth) &&
          p.sidebarWidth >= 200 &&
          p.sidebarWidth <= 320 &&
          Number.isFinite(p.fileWidth) &&
          p.fileWidth >= 360 &&
          p.fileWidth <= 520
        ) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        /* 存储不可用时保持浅色首屏。 */
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f172a'/%3E%3Cpath d='M4 5l3 3-3 3M8 11h4' stroke='%2322c55e' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>ssh-server</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
